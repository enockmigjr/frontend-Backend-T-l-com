name: Qualité frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate --registry=https://registry.npmjs.org/
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contract:check
      - run: pnpm test
        env:
          RUN_REDIS_INTEGRATION: '1'
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: integration
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          BACKEND_INTERNAL_URL: ${{ vars.E2E_BACKEND_URL }}
          PUBLIC_APP_ORIGIN: http://127.0.0.1:3101
          AUTH_CSRF_SECRET: ci-integration-csrf-secret-change-me-2026
          REDIS_URL: redis://127.0.0.1:6379
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
          E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
