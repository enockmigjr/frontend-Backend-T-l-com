upstream itsm_frontend { server frontend:3000; }
upstream itsm_backend { server backend:3000; }

server {
  listen 80;
  server_name _;
  client_max_body_size 11m;

  location /socket.io/ {
    proxy_pass http://itsm_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Le gateway Nest doit valider l'origine réellement envoyée par le navigateur.
    proxy_set_header Origin $http_origin;
    # Le gateway authentifie Socket.IO avec le même cookie HttpOnly que le BFF.
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 65s;
  }

  location / {
    proxy_pass http://itsm_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
